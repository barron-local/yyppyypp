# ==============================================================================
# MOSQUITTO MQTT BROKER CONFIGURATION: mosquitto.conf
# เกณฑ์ข้อ 3.1: "ติดตั้ง MQTT Server และ ตั้งค่าการเข้าถึง (ACL/Auth) ได้"
# ==============================================================================

# พอร์ตมาตรฐาน MQTT
listener 1883 0.0.0.0

# พอร์ต WebSockets สำหรับให้เว็บหรือ Dashboard ต่อตรง
listener 9001 0.0.0.0
protocol websockets

# ปิด anonymous ไม่อนุญาตให้เชื่อมต่อโดยไม่มี username/password
allow_anonymous false

# ไฟล์จัดเก็บรหัสผ่าน (สร้างด้วยคำสั่ง: mosquitto_passwd -c passwordfile iot_user)
password_file /mosquitto/config/passwordfile

# ไฟล์กำหนดสิทธิ์ Access Control List (ACL)
acl_file /mosquitto/config/aclfile

# Persistent Storage
persistence true
persistence_location /mosquitto/data/
log_dest stdout
